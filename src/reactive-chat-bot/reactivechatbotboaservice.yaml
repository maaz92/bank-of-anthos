---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactivechatbotboaservice
  labels:
    app: reactivechatbotboaservice
spec:
  selector:
    matchLabels:
      app: reactivechatbotboaservice
  template:
    metadata:
      labels:
        app: reactivechatbotboaservice
    spec:
      serviceAccountName: reactivechatbotboaservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
          image: YOUR_DOCKER_IMAGE_TAG
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: USERSERVICE_API_ADDR
              value: userservice:8080
            - name: TRANSACTIONS_API_ADDR
              value: ledgerwriter:8080
            - name: BALANCES_API_ADDR
              value: balancereader:8080
            - name: HISTORY_API_ADDR
              value: transactionhistory:8080
            - name: CONTACTS_API_ADDR
              value: contacts:8080
            - name: LOCAL_ROUTING_NUM
              value: "883745000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reactive-chatbot-boa-secret-data
                  key: gemini-api-key
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            # requests:
            #   cpu: 100m
            #   memory: 64Mi
            # limits:
            #   cpu: 200m
            #   memory: 128Mi
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: reactivechatbotboaservice
  labels:
    app: reactivechatbotboaservice
spec:
  type: ClusterIP
  selector:
    app: reactivechatbotboaservice
  ports:
    - name: http
      port: 8501
      targetPort: 8501
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reactivechatbotboaservice
---
apiVersion: v1
kind: Service
metadata:
  name: reactivechatbotboaservice-external
  labels:
    app: reactivechatbotboaservice
spec:
  type: LoadBalancer
  selector:
    app: reactivechatbotboaservice
  ports:
    - name: http
      port: 80
      targetPort: 8501
